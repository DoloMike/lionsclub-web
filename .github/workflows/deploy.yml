name: Deploy

on:
  push:
    branches:
      - main

# Cancel any in-progress deployment for the same branch
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Tailscale ---
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # --- Wait for Coolify to go idle ---
      - name: Cancel queued/in-progress deployments and wait for idle
        run: |
          COOLIFY_HOST="${{ secrets.COOLIFY_HOST }}"
          APP_UUID="${{ secrets.COOLIFY_APPLICATION_UUID }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          # Cancel any active deployments
          DEPS=$(curl -sf \
            "http://${COOLIFY_HOST}/api/v1/deployments/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$DEPS" | python3 -c "
          import json, sys, subprocess
          deps = json.load(sys.stdin)
          data = deps if isinstance(deps, list) else list(deps.values())
          for d in data:
              status = d.get('status','')
              uuid = d.get('deployment_uuid','')
              if status in ('queued','in_progress') and uuid:
                  print(f'Cancelling {uuid} ({status})')
                  subprocess.run(['curl','-sf','-X','POST',
                      f'http://${COOLIFY_HOST}/api/v1/deployments/{uuid}/cancel',
                      '-H',f'Authorization: Bearer {TOKEN}'],
                      capture_output=True)
          " 2>/dev/null || true

          # Wait until no in-progress or queued deployments remain
          echo "Waiting for Coolify to go idle..."
          for i in \$(seq 1 30); do
            ACTIVE=\$(curl -sf \
              "http://${COOLIFY_HOST}/api/v1/deployments/applications/${APP_UUID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              | python3 -c "
          import json,sys
          deps = json.load(sys.stdin)
          data = deps if isinstance(deps, list) else list(deps.values())
          active = [d for d in data if d.get('status') in ('queued','in_progress')]
          print(len(active))
          " 2>/dev/null || echo "0")
            echo "[\$i] Active deployments: \$ACTIVE"
            if [ "\$ACTIVE" = "0" ]; then
              echo "Coolify is idle, proceeding."
              break
            fi
            sleep 5
          done

      # --- Trigger Coolify deploy ---
      - name: Trigger Coolify deploy
        run: |
          COOLIFY_HOST="${{ secrets.COOLIFY_HOST }}"
          APP_UUID="${{ secrets.COOLIFY_APPLICATION_UUID }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          RESULT=$(curl -sf -X POST \
            "http://${COOLIFY_HOST}/api/v1/deploy?uuid=${APP_UUID}&force=false" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$RESULT"
          DEPLOY_UUID=$(echo "$RESULT" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          deployments = d.get('deployments', [])
          if deployments:
              print(deployments[0].get('deployment_uuid'))
          else:
              print('Error: ' + str(d), file=sys.stderr)
              sys.exit(1)
          ")
          echo "Deployment queued: $DEPLOY_UUID"
          echo "DEPLOY_UUID=$DEPLOY_UUID" >> $GITHUB_ENV

      # --- Wait for deploy to finish ---
      - name: Wait for deploy to finish
        run: |
          COOLIFY_HOST="${{ secrets.COOLIFY_HOST }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          for i in \$(seq 1 36); do
            STATUS=\$(curl -sf \
              "http://${COOLIFY_HOST}/api/v1/deployments/\$DEPLOY_UUID" \
              -H "Authorization: Bearer \${TOKEN}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "[\$i] \$STATUS"
            if [ "\$STATUS" = "finished" ]; then exit 0; fi
            if [ "\$STATUS" = "failed" ] || [ "\$STATUS" = "error" ]; then
              echo "Deploy failed!"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy"
          exit 1
